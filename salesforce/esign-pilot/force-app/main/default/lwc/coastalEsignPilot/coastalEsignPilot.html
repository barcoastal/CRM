<template>
  <section class="workspace" role="dialog" aria-label="Send with Coastal Sign">
    <header class="top"><strong>Coastal Sign</strong><span>Salesforce sandbox — TEST, NOT A CONTRACT</span><lightning-button label="Close" onclick={close}></lightning-button></header>
    <template lwc:if={busy}><lightning-spinner alternative-text="Loading Coastal Sign" size="small"></lightning-spinner></template>
    <template lwc:if={error}><div class="slds-notify slds-notify_alert slds-alert_error" role="alert">{error}</div></template>
    <template lwc:if={senderUrl}><iframe src={senderUrl} title="Coastal Sign documents, recipients, prepare and send" referrerpolicy="no-referrer"></iframe></template>
    <template lwc:else>
      <div class="review">
        <template lwc:if={hasPacket}>
          <div class="slds-box slds-m-bottom_medium">Existing test packet: {data.status}
            <lightning-button label="Resume packet in Salesforce" variant="brand" onclick={resume} disabled={busy} class="slds-m-left_small"></lightning-button>
            <lightning-button label="Refresh signing status" onclick={refresh} disabled={busy} class="slds-m-left_small"></lightning-button>
            <template lwc:if={fileUrl}><a href={fileUrl} class="slds-m-left_small">Signed packet in Salesforce Files</a></template>
          </div>
        </template>
        <template lwc:if={showReview}><c-coastal-contract-review record-id={recordId} onreviewcomplete={reviewComplete}></c-coastal-contract-review></template>
        <template lwc:else><lightning-button label="Retry opening sender" onclick={resume} disabled={busy}></lightning-button></template>
      </div>
    </template>
  </section>
</template>
